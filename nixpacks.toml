[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mysqli",
  "php82Extensions.mbstring",
  "php82Extensions.gd",
  "php82Extensions.json",
  "php82Extensions.openssl",
  "php82Extensions.fileinfo",
  "php82Extensions.curl"
]

[phases.build]
cmds = [
  '> php.ini',
  'for e in pdo_mysql mysqli mbstring gd openssl fileinfo curl; do p=$(find /nix/store -name "$e.so" 2>/dev/null | head -n1); if [ -n "$p" ]; then echo "extension=$p" >> php.ini; fi; done'
]

[start]
cmd = "php -c php.ini -S 0.0.0.0:$PORT -t ."